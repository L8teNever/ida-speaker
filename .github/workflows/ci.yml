name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret-Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      VOSK_VERSION: "0.3.45"
      RUSTFLAGS: "-L /usr/local/lib"
    steps:
      - uses: actions/checkout@v4
      - name: Pakete
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev libasound2-dev pkg-config ninja-build unzip
          pipx install meson
      - name: libvosk
        run: |
          curl -fsSL -o /tmp/vosk.zip "https://github.com/alphacep/vosk-api/releases/download/v${VOSK_VERSION}/vosk-linux-x86_64-${VOSK_VERSION}.zip"
          sudo unzip -j /tmp/vosk.zip '*/libvosk.so' -d /usr/local/lib
          sudo ldconfig
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
