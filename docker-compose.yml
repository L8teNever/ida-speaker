# Auf dem Raspberry Pi: `docker compose up -d`, dann http://<pi>:8080 öffnen.
# Alle Einstellungen (IDA, Cloudflare, Audio, Wake-Word) macht man auf der Website; sie liegen im Volume /data.
services:
  ida-speaker:
    image: ghcr.io/l8tenever/ida-speaker:latest
    container_name: ida-speaker
    restart: unless-stopped
    ports:
      - "8080:8080"
    devices:
      - /dev/snd:/dev/snd          # Mikrofon und Lautsprecher
      - /dev/net/tun:/dev/net/tun  # Cloudflare WARP
    group_add:
      - audio
    cap_add:
      - NET_ADMIN                  # WARP richtet im Container eine Netzwerkschnittstelle ein
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - ida-speaker:/data
      - warp:/var/lib/cloudflare-warp
      # WLAN, Einrichtungs-WLAN, Neustart/Ausschalten: NetworkManager und systemd des Pi über dessen D-Bus
      - /run/dbus/system_bus_socket:/run/host-dbus/system_bus_socket
      - /etc/hostname:/etc/host-hostname:ro
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - RUST_LOG=${RUST_LOG:-info}

  # Spotify Soloist (offizieller Spotify-Client): im Netzwerk des Pi, damit die Spotify-App ihn findet.
  # Lädt Soloist selbst herunter; Ton und Steuerung laufen über das geteilte Volume zu ida-speaker.
  ida-speaker-spotify:
    image: ghcr.io/l8tenever/ida-speaker:latest
    container_name: ida-speaker-spotify
    restart: unless-stopped
    network_mode: host
    entrypoint: ["/usr/bin/tini", "-g", "--", "/usr/local/bin/soloist.sh"]
    volumes:
      - ida-speaker:/data

volumes:
  ida-speaker:
  warp:
